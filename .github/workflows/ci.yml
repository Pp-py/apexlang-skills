name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # a run on a branch before its PR: gh workflow run ci.yml --ref <branch>

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04            # pinned: the ubuntu-latest label moves to a new release on its own schedule
    steps:
      - uses: actions/checkout@v5    # node24 runtime; v4 triggers the Node 20 deprecation notice
      - name: shellcheck every tracked shell script
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck -x   # -x follows the sourced helper

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: jsonschema (the version Ubuntu ships, as a user installing from apt gets it)
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-jsonschema
      - name: schemas, fixtures, negatives and every result the e2e emits
        run: bash tests/contract/run.sh

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash          # Git Bash on windows-latest — the only supported Windows shell
    steps:
      - uses: actions/checkout@v5      # .gitattributes keeps *.sh at LF, so bash can run them
      - name: sync-guard e2e (stubbed SQLcl)
        run: bash tests/integration/sync-guard-e2e.sh
      - name: pw.sh smoke (stubbed Playwright CLI)
        run: bash tests/integration/pw-wrapper-smoke.sh
      - name: apex-sync.json read alike by the guard and by pw.sh
        run: bash tests/integration/config-parity.sh
