name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # a run on a branch before its PR: gh workflow run ci.yml --ref <branch>

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04            # pinned: the ubuntu-latest label moves to a new release on its own schedule
    timeout-minutes: 10              # the default is 6 hours: a hang must fail, not burn the day
    steps:
      - uses: actions/checkout@v5    # node24 runtime; v4 triggers the Node 20 deprecation notice
      - name: shellcheck every tracked shell script
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck -x   # -x follows the sourced helper

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: jsonschema (the version Ubuntu ships, as a user installing from apt gets it)
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-jsonschema
      - name: schemas, fixtures, negatives and every result the e2e emits
        run: bash tests/contract/run.sh

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30              # Git Bash runs the e2e in minutes; a hang ran past 35 once
    defaults:
      run:
        shell: bash          # Git Bash on windows-latest — the only supported Windows shell
    steps:
      - uses: actions/checkout@v5      # .gitattributes keeps *.sh at LF, so bash can run them
      - name: sync-guard e2e (stubbed SQLcl)
        run: bash tests/integration/sync-guard-e2e.sh
      - name: pw.sh smoke (stubbed Playwright CLI)
        run: bash tests/integration/pw-wrapper-smoke.sh
      - name: apex-sync.json read alike by the guard and by pw.sh
        run: bash tests/integration/config-parity.sh
      - name: evidence.py (runtime and architecture results, raw evidence, redaction)
        run: bash tests/integration/evidence.sh
      - name: apexlang-architecture red-flag scan (fixtures and the examples)
        run: bash tests/integration/arch-scan.sh
      - name: apex-ux static scan (fixtures and the examples)
        run: bash tests/integration/ux-scan.sh
      - name: apex-ux runtime checks (stubbed Playwright CLI)
        run: bash tests/integration/ux-check.sh
      - name: apex-security static scan (fixtures and the examples)
        run: bash tests/integration/sec-scan.sh
      - name: apex-security package scan (fixtures and the examples)
        run: bash tests/integration/plsql-scan.sh
      - name: apex-security runtime probes (stubbed Playwright CLI, local HTTP)
        run: bash tests/integration/sec-probe.sh
      - name: apex-security secrets scan (a scratch repo, and this one)
        run: bash tests/integration/secrets-scan.sh
      - name: apexlang-delivery aggregator (stamped results, a real Validation capture)
        run: bash tests/integration/delivery.sh
      - name: the CI example's scan step, verbatim, over the examples
        run: bash tests/integration/ci-example.sh
